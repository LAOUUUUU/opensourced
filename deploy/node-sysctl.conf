net.ipv4.ip_forward = 1
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
net.core.netdev_max_backlog = 5000
net.ipv4.tcp_mtu_probing = 1
# Connection tracking (decision 029): every connection through the VPN's NAT takes an entry, and
# a full table drops new connections. The default for 1 GB of RAM was 8,192; as many hash buckets
# as entries, the kernel's own ratio. nf_conntrack is loaded before this file is read at boot
# (/etc/modules-load.d/bf-conntrack.conf, written by deploy/node-tune.sh).
net.netfilter.nf_conntrack_buckets = 65536
net.netfilter.nf_conntrack_max = 65536
