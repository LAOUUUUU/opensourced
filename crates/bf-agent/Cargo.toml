[package]
name = "bf-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bf-common = { version = "0.7.0", path = "../bf-common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time", "sync"] }

[features]
# Makes the fake WireGuard and other test helpers usable from other crates' tests.
testing = []

[lints]
workspace = true
