[package]
name = "bf-control"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bf-common = { version = "0.5.0", path = "../bf-common" }
hmac = "0.13.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "sync", "time"] }
x25519-dalek = "3.0.0"

[dev-dependencies]
bf-agent = { path = "../bf-agent", features = ["testing"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "aws_lc_rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }

[lints]
workspace = true
