{% extends "base.html" %}
{% block back %}/admin{% endblock %}
{% block title %}Admin · Barely-free{% endblock %}
{% block content %}
<h1>Admin</h1>
<p class="lead">Enter the admin password to continue.</p>
{% if failed %}<p class="notice" role="alert">That did not work. Try again in a moment.</p>{% endif %}
<form method="post" action="/admin/unlock">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="admin-password">Admin password</label>
  <input id="admin-password" type="password" name="password" autocomplete="current-password" required maxlength="256">
  <p class="actions"><button class="button" type="submit">Unlock</button></p>
</form>
{% endblock %}
